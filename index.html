<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Web3 Universal Connect</title>
    <!-- Ethers.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <!-- Web3Modal CDN (WalletConnect integration) -->
    <script src="https://unpkg.com/web3modal@1.9.12/dist/index.js"></script>
    <script src="https://unpkg.com/@walletconnect/web3-provider@1.8.0/dist/umd/index.min.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background: #0b0f19; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #151c2c; border: 1px solid #232d42; border-radius: 20px; padding: 25px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        h2 { color: #38bdf8; font-size: 22px; margin-bottom: 6px; }
        p.subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 18px; }
        
        .status-box { background: #0b0f19; border: 1px solid #232d42; border-radius: 12px; padding: 12px; font-size: 13px; color: #f59e0b; word-break: break-all; margin-bottom: 18px; font-weight: 600; }
        
        .btn-connect { width: 100%; padding: 16px; font-size: 16px; font-weight: bold; border: none; border-radius: 14px; cursor: pointer; transition: 0.2s; color: white; background: linear-gradient(135deg, #2563eb, #1d4ed8); display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px; }
        .btn-connect:active { transform: scale(0.98); }

        .btn-dash { width: 100%; padding: 14px; font-size: 15px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; transition: 0.2s; color: white; background: linear-gradient(135deg, #10b981, #047857); display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Dimex DApp Connect</h2>
        <p class="subtitle">SafePal, Trust Wallet & அனைத்து வாலட்டுகளையும் இணைக்கவும்</p>

        <div id="status" class="status-box">வாலட் இணைக்கப்படவில்லை</div>

        <!-- Universal Connect Button -->
        <button class="btn-connect" onclick="onConnect()">
            <span>🛡️ Connect Wallet (All Wallets)</span>
        </button>

        <!-- Go to Dashboard Button (Appears after connection) -->
        <button id="dashBtn" class="btn-dash" onclick="goToDashboard()">
            🚀 Go to Dashboard (/dash)
        </button>
    </div>

    <script>
        // Web3Modal Setup
        const Web3Modal = window.Web3Modal.default;
        const WalletConnectProvider = window.WalletConnectProvider.default;

        let web3Modal;
        let provider, signer, userAddress;

        // Initialize Web3Modal with WalletConnect & Injected Providers
        function initWeb3Modal() {
            const providerOptions = {
                walletconnect: {
                    package: WalletConnectProvider,
                    options: {
                        // உங்கள் DApp-க்கான RPC அல்லது இன்ஃபுரா (Infura / Alchemy) ஐடி கொடுக்கலாம் (அல்லது பொதுவானது)
                        infuraId: "27e484dcd9e3efcfd25a83a787363158" 
                    }
                }
            };

            web3Modal = new Web3Modal({
                cacheProvider: false,
                providerOptions,
                theme: "dark"
            });
        }

        window.addEventListener('load', () => {
            initWeb3Modal();
        });

        // Connect Function
        async function onConnect() {
            try {
                updateStatus("வாலட் தேடப்படுகிறது...", "#38bdf8");
                
                // Open Web3Modal selection popup (SafePal, Trust, MetaMask etc.)
                const instance = await web3Modal.connect();

                provider = new ethers.providers.Web3Provider(instance);
                signer = provider.getSigner();
                userAddress = await signer.getAddress();

                updateStatus("இணைக்கப்பட்டது: " + formatAddress(userAddress), "#10b981");
                
                // Show Dashboard Button
                document.getElementById("dashBtn").style.display = "block";

                // Listen for account changes
                instance.on("accountsChanged", (accounts) => {
                    if (accounts.length > 0) {
                        userAddress = accounts[0];
                        updateStatus("இணைக்கப்பட்டது: " + formatAddress(userAddress), "#10b981");
                    } else {
                        onDisconnect();
                    }
                });

            } catch(e) {
                console.error("Connection error: ", e);
                updateStatus("இணைப்பு ரத்து செய்யப்பட்டது", "#ef4444");
            }
        }

        // Navigate to Dashboard
        function goToDashboard() {
            window.location.href = "https://dimex.tech/dash";
        }

        function updateStatus(msg, color) {
            const statusEl = document.getElementById("status");
            statusEl.innerText = msg;
            statusEl.style.color = color;
        }

        function formatAddress(addr) {
            return addr.substring(0, 6) + "..." + addr.substring(addr.length - 4);
        }
    </script>

</body>
</html>
