<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Wallet Web3 Staking</title>
    <!-- Ethers.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background: #0b0f19; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #151c2c; border: 1px solid #232d42; border-radius: 20px; padding: 25px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        h2 { color: #38bdf8; font-size: 22px; margin-bottom: 6px; }
        p.subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 18px; }
        
        .status-box { background: #0b0f19; border: 1px solid #232d42; border-radius: 12px; padding: 12px; font-size: 13px; color: #f59e0b; word-break: break-all; margin-bottom: 18px; font-weight: 600; }
        
        .section-title { text-align: left; font-size: 13px; color: #64748b; margin: 12px 0 8px 4px; font-weight: 600; text-transform: uppercase; }
        
        .wallet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .btn-wallet { padding: 12px 10px; font-size: 13px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; transition: all 0.2s; color: white; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-wallet:active { transform: scale(0.96); }

        /* Wallet Colors */
        .w-trust { background: #3375bb; }
        .w-meta { background: #e4761b; }
        .w-safepal { background: #00d563; color: #000; }
        .w-tokenpocket { background: #29b6f6; }
        .w-bitget { background: #00f0ff; color: #000; }
        .w-okx { background: #ffffff; color: #000; }
        .w-phantom { background: #ab9ff2; color: #000; }
        .w-rainbow { background: #001e59; border: 1px solid #38bdf8; }

        .action-box { border-top: 1px solid #232d42; pt: 15px; margin-top: 10px; }
        .btn-action { width: 100%; padding: 14px; margin: 6px 0; font-size: 15px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; transition: 0.2s; color: white; }
        .btn-connect { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
        .btn-stake { background: linear-gradient(135deg, #10b981, #047857); }
        .btn-claim { background: linear-gradient(135deg, #f59e0b, #b45309); }
        .btn-action:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="card">
        <h2>Web3 Staking Hub</h2>
        <p class="subtitle">உங்கள் வாலட்டைத் தேர்ந்தெடுத்து DApp-ஐ திறக்கவும்</p>

        <div id="status" class="status-box">வாலட் தேர்ந்தெடுக்கப்படவில்லை</div>

        <div class="section-title">Select Wallet App</div>
        <div class="wallet-grid">
            <button class="btn-wallet w-trust" onclick="openWalletApp('trust')">🔵 Trust Wallet</button>
            <button class="btn-wallet w-meta" onclick="openWalletApp('metamask')">🦊 MetaMask</button>
            <button class="btn-wallet w-safepal" onclick="openWalletApp('safepal')">🛡️ SafePal</button>
            <button class="btn-wallet w-tokenpocket" onclick="openWalletApp('tokenpocket')">🟢 TokenPocket</button>
            <button class="btn-wallet w-bitget" onclick="openWalletApp('bitget')">🩵 Bitget Wallet</button>
            <button class="btn-wallet w-okx" onclick="openWalletApp('okx')">⬛ OKX Wallet</button>
            <button class="btn-wallet w-phantom" onclick="openWalletApp('phantom')">👻 Phantom</button>
            <button class="btn-wallet w-rainbow" onclick="openWalletApp('rainbow')">🌈 Rainbow</button>
        </div>

        <div class="action-box">
            <button class="btn-action btn-connect" onclick="connectInAppWallet()">🔗 Connect Wallet (In-App)</button>
            <button class="btn-action btn-stake" onclick="handleTx('Stake')">⚡ Stake Demo</button>
            <button class="btn-action btn-claim" onclick="handleTx('Claim')">🎁 Claim Reward</button>
        </div>
    </div>

    <script>
        const currentUrl = window.location.href;
        const encodedUrl = encodeURIComponent(currentUrl);
        const hostAndPath = window.location.host + window.location.pathname;

        let provider, signer, userAddress;

        // 1. DApp பிரவுசருக்குள் ஏற்கனவே திறக்கப்பட்டிருந்தால் ஆட்டோ-கனெக்ட் செய்யும்
        window.addEventListener('load', async () => {
            if (window.ethereum) {
                try {
                    provider = new ethers.providers.Web3Provider(window.ethereum, "any");
                    const accounts = await provider.listAccounts();
                    if (accounts.length > 0) {
                        userAddress = accounts[0];
                        signer = provider.getSigner();
                        updateStatus("இணைக்கப்பட்டது: " + formatAddress(userAddress), "#10b981");
                    } else {
                        updateStatus("DApp பிரவுசர் தயார். 'Connect Wallet' அழுத்தவும்.", "#38bdf8");
                    }
                } catch (e) {
                    console.error(e);
                }
            }
        });

        // 2. வெளி பிரவுசரில் இருந்து குறிப்பிட்ட வாலட் ஆப்பைத் திறக்கும் பங்க்ஷன்
        function openWalletApp(wallet) {
            const statusEl = document.getElementById("status");
            let deepLink = "";

            switch(wallet) {
                case 'trust':
                    deepLink = "https://link.trustwallet.com/open_url?url=" + encodedUrl;
                    break;
                case 'metamask':
                    deepLink = "https://metamask.app.link/dapp/" + hostAndPath;
                    break;
                case 'safepal':
                    deepLink = "safepalwallet://sfp/dapp?url=" + encodedUrl;
                    break;
                case 'tokenpocket':
                    deepLink = "tpoutside://openDapp?url=" + encodedUrl;
                    break;
                case 'bitget':
                    deepLink = "https://bkcode.vip?action=dapp&url=" + encodedUrl;
                    break;
                case 'okx':
                    deepLink = "okx://wallet/dapp/details?dappUrl=" + encodedUrl;
                    break;
                case 'phantom':
                    deepLink = "https://phantom.app/ul/browse/" + encodedUrl;
                    break;
                case 'rainbow':
                    deepLink = "https://rainbow.me/open/dapp?url=" + encodedUrl;
                    break;
            }

            updateStatus("வாலட் ஆப் திறக்கப்படுகிறது...", "#38bdf8");
            
            setTimeout(() => {
                window.location.href = deepLink;
            }, 300);
        }

        // 3. வாலட் ஆப்பிற்குள் வந்ததும் இணைக்கும் பங்க்ஷன்
        async function connectInAppWallet() {
            if (window.ethereum) {
                try {
                    provider = new ethers.providers.Web3Provider(window.ethereum, "any");
                    const accounts = await provider.send("eth_requestAccounts", []);
                    userAddress = accounts[0];
                    signer = provider.getSigner();
                    
                    updateStatus("இணைக்கப்பட்டது: " + formatAddress(userAddress), "#10b981");
                    alert("வாலட் வெற்றிகரமாக இணைக்கப்பட்டது!");
                } catch (err) {
                    console.error(err);
                    updateStatus("இணைப்பு நிராகரிக்கப்பட்டது", "#ef4444");
                }
            } else {
                alert("மேலே உள்ள பட்டியலில் இருந்து உங்களது வாலட் ஆப்பைத் தேர்ந்தெடுத்துத் திறக்கவும்!");
            }
        }

        // 4. Stake / Claim ட்ரான்சாக்ஷன் பாப்-அப்
        async function handleTx(action) {
            if (!signer) {
                alert("முதலில் உங்களது வாலட் ஆப்பிற்குள் சென்று 'Connect Wallet' செய்யவும்!");
                return;
            }

            try {
                updateStatus(action + " கன்ஃபார்மேஷன் வாலட்டிற்கு அனுப்பப்படுகிறது...", "#f59e0b");

                const tx = await signer.sendTransaction({
                    to: userAddress,
                    value: ethers.utils.parseEther("0.00")
                });

                updateStatus(action + " வெற்றிகரமாக முடிந்தது!", "#10b981");
                alert(action + " வெற்றி!");
            } catch (err) {
                console.error(err);
                updateStatus(action + " ரத்து செய்யப்பட்டது", "#ef4444");
            }
        }

        function updateStatus(msg, color) {
            const statusEl = document.getElementById("status");
            statusEl.innerText = msg;
            statusEl.style.color = color;
        }

        function formatAddress(addr) {
            return addr.substring(0, 6) + "..." + addr.substring(addr.length - 4);
        }
    </script>

</body>
</html>
