<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimex Web3 Direct Connect</title>
    <!-- Ethers.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background: #0b0f19; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #151c2c; border: 1px solid #232d42; border-radius: 20px; padding: 25px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        h2 { color: #38bdf8; font-size: 22px; margin-bottom: 6px; }
        p.subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 18px; }
        
        .status-box { background: #0b0f19; border: 1px solid #232d42; border-radius: 12px; padding: 12px; font-size: 13px; color: #f59e0b; word-break: break-all; margin-bottom: 18px; font-weight: 600; }
        
        .btn-connect { width: 100%; padding: 16px; font-size: 16px; font-weight: bold; border: none; border-radius: 14px; cursor: pointer; transition: 0.2s; color: white; background: linear-gradient(135deg, #2563eb, #1d4ed8); display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px; }
        .btn-connect:active { transform: scale(0.98); }

        .btn-dash { width: 100%; padding: 14px; font-size: 15px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; transition: 0.2s; color: white; background: linear-gradient(135deg, #10b981, #047857); display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Dimex DApp Portal</h2>
        <p class="subtitle">SafePal & Trust Wallet நேரடி இணைப்பு</p>

        <div id="status" class="status-box">வாலட் இணைக்கப்படவில்லை</div>

        <!-- Direct Injected Connect Button -->
        <button class="btn-connect" onclick="connectWallet()">
            <span>🔗 Connect Wallet (In-App)</span>
        </button>

        <!-- Go to Dashboard Button -->
        <button id="dashBtn" class="btn-dash" onclick="goToDashboard()">
            🚀 Go to Dashboard (/dash)
        </button>
    </div>

    <script>
        let provider, signer, userAddress;

        async function connectWallet() {
            // SafePal, Trust Wallet மற்றும் பிற DApp பிரவுசர்களில் உள்ள window.ethereum-ஐ நேரடியாகக் கண்டறியும்
            if (typeof window.ethereum !== 'undefined' || (typeof window.web3 !== 'undefined')) {
                try {
                    updateStatus("வாலட் ஒப்புதல் கேட்கப்படுகிறது...", "#38bdf8");

                    // Modern EthersProvider injection
                    const ethProvider = window.ethereum || window.web3.currentProvider;
                    provider = new ethers.providers.Web3Provider(ethProvider, "any");

                    // Request accounts directly
                    const accounts = await ethProvider.request({ method: 'eth_requestAccounts' });
                    
                    if (accounts && accounts.length > 0) {
                        userAddress = accounts[0];
                        signer = provider.getSigner();
                        
                        updateStatus("இணைக்கப்பட்டது: " + formatAddress(userAddress), "#10b981");
                        
                        // Show Dashboard Button & Automatically Redirect after 1 second
                        document.getElementById("dashBtn").style.display = "block";
                        
                        setTimeout(() => {
                            window.location.href = "https://dimex.tech/dash";
                        }, 1000);
                    }
                } catch (error) {
                    console.error("Connection rejected: ", error);
                    updateStatus("இணைப்பு நிராகரிக்கப்பட்டது அல்லது பிழை ஏற்பட்டது", "#ef4444");
                }
            } else {
                alert("தயவுசெய்து SafePal அல்லது Trust Wallet ஆப்பிற்குள் இருக்கும் DApp பிரவுசர் மூலம் இந்தத் தளத்தைத் திறக்கவும்!");
                updateStatus("வாலட் பிரவுசர் கண்டறியப்படவில்லை", "#ef4444");
            }
        }

        function goToDashboard() {
            window.location.href = "https://dimex.tech/dash";
        }

        function updateStatus(msg, color) {
            const statusEl = document.getElementById("status");
            statusEl.innerText = msg;
            statusEl.style.color = color;
        }

        function formatAddress(addr) {
            return addr.substring(0, 6) + "..." + addr.substring(addr.length - 4);
        }
    </script>

</body>
</html>
