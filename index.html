<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimex Wallet Launch Hub</title>
    <!-- Ethers.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background: #0b0f19; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #151c2c; border: 1px solid #232d42; border-radius: 20px; padding: 25px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        h2 { color: #38bdf8; font-size: 22px; margin-bottom: 6px; }
        p.subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 18px; }
        
        .status-box { background: #0b0f19; border: 1px solid #232d42; border-radius: 12px; padding: 12px; font-size: 13px; color: #f59e0b; word-break: break-all; margin-bottom: 18px; font-weight: 600; }
        
        .section-title { text-align: left; font-size: 13px; color: #64748b; margin: 12px 0 8px 4px; font-weight: 600; text-transform: uppercase; }
        
        .wallet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .btn-wallet { padding: 14px 10px; font-size: 13px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; transition: all 0.2s; color: white; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-wallet:active { transform: scale(0.96); }

        /* Wallet Brand Colors */
        .w-safepal { background: #00d563; color: #000; grid-column: span 2; font-size: 15px; } /* SafePal பெரிய பட்டனாக முதன்மையாக இருக்கும் */
        .w-trust { background: #3375bb; }
        .w-meta { background: #e4761b; }
        .w-tokenpocket { background: #29b6f6; color: #000; }
        .w-bitget { background: #00f0ff; color: #000; }
        .w-okx { background: #ffffff; color: #000; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Dimex DApp Hub</h2>
        <p class="subtitle">உங்கள் வாலட் மூலம் டேஷ்போர்டைத் திறக்கவும்</p>

        <div id="status" class="status-box">வாலட் தேர்ந்தெடுக்கப்படவில்லை</div>

        <div class="section-title">Select Your Wallet</div>
        <div class="wallet-grid">
            <!-- SafePal Main Button -->
            <button class="btn-wallet w-safepal" onclick="openWalletApp('safepal')">🛡️ Open in SafePal Wallet</button>
            
            <button class="btn-wallet w-trust" onclick="openWalletApp('trust')">🔵 Trust Wallet</button>
            <button class="btn-wallet w-meta" onclick="openWalletApp('metamask')">🦊 MetaMask</button>
            <button class="btn-wallet w-tokenpocket" onclick="openWalletApp('tokenpocket')">🟢 TokenPocket</button>
            <button class="btn-wallet w-bitget" onclick="openWalletApp('bitget')">🩵 Bitget</button>
            <button class="btn-wallet w-okx" onclick="openWalletApp('okx')">⬛ OKX</button>
        </div>
    </div>

    <script>
        // உங்களது நேரடி டேஷ்போர்டு லிங்க்
        const targetDashboardUrl = "https://dimex.tech/dash";
        const encodedDashboardUrl = encodeURIComponent(targetDashboardUrl);

        function openWalletApp(walletType) {
            let deepLinkUrl = "";
            let walletName = "";

            switch(walletType) {
                case 'safepal':
    walletName = "SafePal";
    
    // SafePal App Native Scheme Direct Trigger
    var dappUrl = "https://dimex.tech/dash";
    
    // 1. SafePal Custom Scheme (நேரடியாக ஆப்பில் DApp-ஐ திறக்க)
    var safepalAppScheme = "safepalwallet://passthrough?url=" + encodeURIComponent(dappUrl);
    
    // 2. SafePal Universal Link Fallback
    var safepalWebLink = "https://link.safepal.io/open/dapp?url=" + encodeURIComponent(dappUrl);

    // முதலில் Native Scheme இயங்கும், அது வேலை செய்யாவிட்டால் Universal Link-க்கு மாறும்
    window.location.href = safepalAppScheme;
    
    setTimeout(function() {
        window.location.href = safepalWebLink;
    }, 500);
    break;
                case 'trust':
                    walletName = "Trust Wallet";
                    deepLinkUrl = "https://link.trustwallet.com/open_url?url=" + encodedDashboardUrl;
                    break;
                case 'metamask':
                    walletName = "MetaMask";
                    deepLinkUrl = "https://metamask.app.link/dapp/dimex.tech/dash";
                    break;
                case 'tokenpocket':
                    walletName = "TokenPocket";
                    deepLinkUrl = "tpoutside://openDapp?url=" + encodedDashboardUrl;
                    break;
                case 'bitget':
                    walletName = "Bitget Wallet";
                    deepLinkUrl = "https://bkcode.vip?action=dapp&url=" + encodedDashboardUrl;
                    break;
                case 'okx':
                    walletName = "OKX Wallet";
                    deepLinkUrl = "okx://wallet/dapp/details?dappUrl=" + encodedDashboardUrl;
                    break;
            }

        updateStatus(walletName + " ஆப் திறக்கப்படுகிறது...", "#38bdf8");

            // மொபைல் பிரவுசரில் இருந்து வாலட் ஆப்பிற்கு ரீடைரக்ட் செய்யும்
            setTimeout(() => {
                window.location.href = deepLinkUrl;
            }, 300);
        }

        function updateStatus(msg, color) {
            const statusEl = document.getElementById("status");
            statusEl.innerText = msg;
            statusEl.style.color = color;
        }
    </script>

</body>
</html>
