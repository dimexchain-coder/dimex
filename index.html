<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>External Wallet Deep Link Connect</title>
    <!-- Ethers.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background: #0b0f19; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #151c2c; border: 1px solid #232d42; border-radius: 20px; padding: 25px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        h2 { color: #38bdf8; font-size: 22px; margin-bottom: 6px; }
        p.subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 18px; }
        
        .status-box { background: #0b0f19; border: 1px solid #232d42; border-radius: 12px; padding: 12px; font-size: 13px; color: #f59e0b; word-break: break-all; margin-bottom: 18px; font-weight: 600; }
        
        .section-title { text-align: left; font-size: 13px; color: #64748b; margin: 12px 0 8px 4px; font-weight: 600; text-transform: uppercase; }
        
        .wallet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .btn-wallet { padding: 14px 10px; font-size: 13px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; transition: all 0.2s; color: white; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-wallet:active { transform: scale(0.96); }

        /* Wallet Brand Colors */
        .w-safepal { background: #00d563; color: #000; }
        .w-trust { background: #3375bb; }
        .w-meta { background: #e4761b; }
        .w-tokenpocket { background: #29b6f6; color: #000; }
    </style>
</head>
<body>

    <div class="card">
        <h2>External Wallet Launcher</h2>
        <p class="subtitle">வெளியிலிருந்து உங்கள் வாலட் ஆப்பைத் திறக்கவும்</p>

        <div id="status" class="status-box">வாலட் தேர்ந்தெடுக்கப்படவில்லை</div>

        <div class="section-title">Select Wallet to Open App</div>
        <div class="wallet-grid">
            <button class="btn-wallet w-safepal" onclick="openExternalWallet('safepal')">🛡️ SafePal</button>
            <button class="btn-wallet w-trust" onclick="openExternalWallet('trust')">🔵 Trust Wallet</button>
            <button class="btn-wallet w-meta" onclick="openExternalWallet('metamask')">🦊 MetaMask</button>
            <button class="btn-wallet w-tokenpocket" onclick="openExternalWallet('tokenpocket')">🟢 TokenPocket</button>
        </div>
    </div>

    <script>
        // உங்கள் தளம் மற்றும் டேஷ்போர்டு முகவரி
        const currentWebsite = "https://dimex.tech/dash";
        const encodedUrl = encodeURIComponent(currentWebsite);

        function openExternalWallet(walletType) {
            let deepLinkUrl = "";
            let walletName = "";

            switch(walletType) {
                case 'safepal':
                    walletName = "SafePal";
                    // SafePal ஆப்பை வெளியே இருந்து நேராகத் திறக்க மற்றும் DApp பிரவுசரில் லோட் செய்ய
                    deepLinkUrl = "https://link.safepal.io/open/dapp?url=" + encodedUrl;
                    break;
                case 'trust':
                    walletName = "Trust Wallet";
                    deepLinkUrl = "https://link.trustwallet.com/open_url?url=" + encodedUrl;
                    break;
                case 'metamask':
                    walletName = "MetaMask";
                    deepLinkUrl = "https://metamask.app.link/dapp/dimex.tech/dash";
                    break;
                case 'tokenpocket':
                    walletName = "TokenPocket";
                    deepLinkUrl = "tpoutside://openDapp?url=" + encodedUrl;
                    break;
            }

            updateStatus(walletName + " ஆப் திறக்கப்படுகிறது...", "#38bdf8");

            // மொபைல் பிரவுசரில் இருந்து வாலட் ஆப்பிற்கு ரீடைரக்ட் செய்யும்
            setTimeout(() => {
                window.location.href = deepLinkUrl;
            }, 400);
        }

        function updateStatus(msg, color) {
            const statusEl = document.getElementById("status");
            statusEl.innerText = msg;
            statusEl.style.color = color;
        }
    </script>

</body>
</html>
