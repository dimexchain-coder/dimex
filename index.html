<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3 350+ Wallet Selector</title>
    
    <!-- WalletConnect AppKit & Ethers Standalone Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/@walletconnect/ethereum-provider@2.10.1/dist/index.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 20px; padding: 30px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 15px 30px rgba(0,0,0,0.5); }
        h2 { color: #38bdf8; font-size: 22px; margin-bottom: 8px; }
        p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        .status { background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 10px; font-size: 13px; color: #f59e0b; word-break: break-all; margin-bottom: 20px; font-weight: 600; }
        button { width: 100%; padding: 14px; margin: 8px 0; font-size: 15px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; transition: 0.2s; }
        .btn-connect { background: #2563eb; color: white; }
        .btn-stake { background: #10b981; color: white; }
        .btn-claim { background: #f59e0b; color: white; }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="card">
        <h2>Web3 Multi-Wallet DApp</h2>
        <p>350+ வாலட்களில் இருந்து தேர்ந்தெடுக்கும் முறை</p>

        <div id="status" class="status">வாலட் இணைக்கப்படவில்லை</div>

        <button class="btn-connect" onclick="connectWithWalletList()">🔗 Connect Wallet ( Select Wallet )</button>
        <button class="btn-stake" onclick="handleTx('Stake')">⚡ Stake Demo</button>
        <button class="btn-claim" onclick="handleTx('Claim')">🎁 Claim Demo</button>
    </div>

    <script>
        const PROJECT_ID = "5f72a68ee1e612012cff5f06b3409a6f";
        let wcProvider = null;
        let ethersProvider = null;
        let userAddress = null;

        // 350+ வாலட்களின் பாப்-அப் பட்டியலைத் திறக்கும் பங்க்ஷன்
        async function connectWithWalletList() {
            const statusEl = document.getElementById("status");
            statusEl.innerText = "வாலட் பட்டியல் திரையில் திறக்கப்படுகிறது...";
            statusEl.style.color = "#38bdf8";

            try {
                // WalletConnect Ethereum Provider அமைப்பு
                wcProvider = await WalletConnectProvider.EthereumProvider.init({
                    projectId: PROJECT_ID,
                    chains: [56], // BNB Chain (1 - Ethereum, 137 - Polygon)
                    showQrModal: true, // இதுதான் 350+ வாலட்களின் பாப்-அப் பட்டியலைக் கொண்டுவரும்
                    metadata: {
                        name: "Staking DApp Demo",
                        description: "Web3 Wallet Connect",
                        url: window.location.href,
                        icons: ["https://walletconnect.com/walletconnect-logo.png"]
                    }
                });

                // வாலட் பட்டியலின் பாப்-அப்பை திரையில் திறக்கிறது
                await wcProvider.enable();

                // இணைக்கப்பட்ட தகவல்களைப் பெறுவது
                ethersProvider = new ethers.providers.Web3Provider(wcProvider);
                const signer = ethersProvider.getSigner();
                userAddress = await signer.getAddress();

                statusEl.innerText = "இணைக்கப்பட்டது: " + userAddress.substring(0, 6) + "..." + userAddress.substring(userAddress.length - 4);
                statusEl.style.color = "#10b981";
                alert("வாலட் வெற்றிகரமாக இணைக்கப்பட்டது!");

            } catch (error) {
                console.error("Wallet Connection Error:", error);
                statusEl.innerText = "வாலட் இணைப்பு ரத்து செய்யப்பட்டது";
                statusEl.style.color = "#ef4444";
            }
        }

        // Stake மற்றும் Claim கிளிக் செய்யும் போது இயங்கும் பங்க்ஷன்
        async function handleTx(action) {
            const statusEl = document.getElementById("status");

            if (!ethersProvider || !userAddress) {
                alert("முதலில் 'Connect Wallet' கொடுத்து உங்களின் வாலட்டைத் தேர்ந்தெடுக்கவும்!");
                return;
            }

            try {
                statusEl.innerText = action + " கன்ஃபார்மேஷன் வாலட்டிற்கு அனுப்பப்படுகிறது...";
                statusEl.style.color = "#f59e0b";

                const signer = ethersProvider.getSigner();

                // வாலட்டில் கன்ஃபார்ம் செய்ய பாப்-அப் அனுப்பப்படுகிறது
                const tx = await signer.sendTransaction({
                    to: userAddress,
                    value: ethers.utils.parseEther("0.00")
                });

                statusEl.innerText = action + " பரிவர்த்தனை முடிந்தது!";
                statusEl.style.color = "#10b981";
                alert(action + " வெற்றி!");

            } catch (err) {
                console.error(err);
                statusEl.innerText = action + " ரத்து செய்யப்பட்டது";
                statusEl.style.color = "#ef4444";
            }
        }
    </script>

</body>
</html>
