<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimex Web3 Connect (WalletConnect v2)</title>
    <!-- Ethers.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <!-- WalletConnect v2 Provider CDN -->
    <script src="https://unpkg.com/@walletconnect/web3-provider@1.8.0/dist/umd/index.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background: #0b0f19; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #151c2c; border: 1px solid #232d42; border-radius: 20px; padding: 25px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        h2 { color: #38bdf8; font-size: 22px; margin-bottom: 6px; }
        p.subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 18px; }
        
        .status-box { background: #0b0f19; border: 1px solid #232d42; border-radius: 12px; padding: 12px; font-size: 13px; color: #f59e0b; word-break: break-all; margin-bottom: 18px; font-weight: 600; }
        
        .btn-connect { width: 100%; padding: 16px; font-size: 16px; font-weight: bold; border: none; border-radius: 14px; cursor: pointer; transition: 0.2s; color: white; background: linear-gradient(135deg, #00d563, #047857); display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px; }
        .btn-connect:active { transform: scale(0.98); }

        .btn-dash { width: 100%; padding: 14px; font-size: 15px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; transition: 0.2s; color: white; background: linear-gradient(135deg, #2563eb, #1d4ed8); display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Dimex DApp Portal</h2>
        <p class="subtitle">PancakeSwap மாடல் நேரடி வாலட் இணைப்பு</p>

        <div id="status" class="status-box">வாலட் இணைக்கப்படவில்லை</div>

        <!-- WalletConnect Trigger Button -->
        <button class="btn-connect" onclick="connectWithWalletConnect()">
            <span>🛡️ Connect SafePal / WalletConnect</span>
        </button>

        <!-- Go to Dashboard -->
        <button id="dashBtn" class="btn-dash" onclick="goToDashboard()">
            🚀 Go to Dashboard (/dash)
        </button>
    </div>

    <script>
        let provider, signer, userAddress;

        async function connectWithWalletConnect() {
            try {
                updateStatus("WalletConnect பிரவுசர் திறக்கப்படுகிறது...", "#38bdf8");

                // WalletConnect Provider இன்ஸ்டன்ட் உருவாக்கம் (PancakeSwap முறை)
                const wcProvider = new WalletConnectProvider.default({
                    infuraId: "27e484dcd9e3efcfd25a83a787363158", // பொதுவான பப்ளிக் இன்ஃபுரா ஐடி
                    qrcode: true, // கியூஆர் கோடு அல்லது டைரக்ட் ஆப் ஓபன் ஆகும்
                    rpc: {
                        56: "https://bsc-dataseed.binance.org/" // Binance Smart Chain (BNB Chain)
                    }
                });

                // வாலட் இணைக்க ஒப்புதல் கோருவது
                await wcProvider.enable();

                provider = new ethers.providers.Web3Provider(wcProvider);
                signer = provider.getSigner();
                userAddress = await signer.getAddress();

                updateStatus("இணைக்கப்பட்டது: " + formatAddress(userAddress), "#10b981");
                
                // டேஷ்போர்டு பட்டனை காட்டுவதுடன் ஆட்டோமேட்டிக்காக /dash பக்கத்திற்கு திருப்புவது
                document.getElementById("dashBtn").style.display = "block";
                
                setTimeout(() => {
                    window.location.href = "https://dimex.tech/dash";
                }, 1000);

            } catch (error) {
                console.error("Connection error: ", error);
                updateStatus("இணைப்பு ரத்து செய்யப்பட்டது அல்லது பிழை", "#ef4444");
            }
        }

        function goToDashboard() {
            window.location.href = "https://dimex.tech/dash";
        }

        function updateStatus(msg, color) {
            const statusEl = document.getElementById("status");
            statusEl.innerText = msg;
            statusEl.style.color = color;
        }

        function formatAddress(addr) {
            return addr.substring(0, 6) + "..." + addr.substring(addr.length - 4);
        }
    </script>

</body>
</html>
